name: Release

# Push a tag like v0.2.3 to build installers for Windows and macOS and
# publish them as a release in this repository (tutorapp, public).
# A latest.json-only mirror is also uploaded to tutorapp_public so that
# clients <=0.2.2 (whose updater endpoint still points there) can update
# once and switch to the new endpoint baked into this release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version tag
        required: true
        default: v0.2.3
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Prepare draft release (tutorapp)
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" == v* ]] || { echo "Run this workflow on a version tag"; exit 1; }
          REPO=kostyanpilkin-hash/tutorapp
          SHA=${{ github.sha }}
          RELEASES=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -z "$RELEASES" ]]; then
            RELEASES=$(gh api --method POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f target_commitish="$SHA" \
              -f name="TutorApp $TAG" -f body="Установщики для Windows и macOS." \
              -F draft=true --jq '.id')
          fi
          [[ "$RELEASES" =~ ^[0-9]+$ ]]
          echo "id=$RELEASES" >> "$GITHUB_OUTPUT"

      - name: Prepare legacy mirror draft (tutorapp_public)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          REPO=kostyanpilkin-hash/tutorapp_public
          SHA=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          RELEASES=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -z "$RELEASES" ]]; then
            gh api --method POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f target_commitish="$SHA" \
              -f name="TutorApp $TAG" -f body="Зеркало latest.json для клиентов <=0.2.2." \
              -F draft=true --jq '.id'
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
          # macOS runners can sit in queue for 15+ min; a cancelled leg must
          # not block the release — latest.json will just contain Windows
          # until a rerun lands it.
          # macos-14 pinned: 'macos-latest' currently migrates to macos-15
          # and its pool is the most contended; macos-14 (arm64) queues faster.
          - platform: macos-14
            args: "--target universal-apple-darwin"
            can-fail: true
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.can-fail || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: kostyanpilkin-hash
          repo: tutorapp
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "TutorApp ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: "Установщики для Windows (.msi / -setup.exe) и macOS (.dmg, Apple Silicon + Intel)."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Both matrix builds only produce their own platform's .sig assets; merge
  # them into a single latest.json so the updater sees all platforms.
  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Assemble and upload latest.json (tutorapp)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: kostyanpilkin-hash/tutorapp
        run: |
          set -euo pipefail
          mkdir -p sig
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sig --clobber
          NSIS_SIG=$(ls sig/*-setup.exe.sig | head -1)
          NSIS=$(basename "$NSIS_SIG" .sig)
          BASE="https://github.com/$REPO/releases/download/$TAG"
          enc() { jq -rn --arg s "$1" '$s|@uri'; }
          PLATFORMS=$(jq -n \
            --arg wsig "$(cat "$NSIS_SIG")" \
            --arg wurl "$BASE/$(enc "$NSIS")" \
            '{"windows-x86_64": {signature:$wsig, url:$wurl}}')
          # macOS leg is best-effort (can-fail): add darwin targets only when
          # its .sig actually made it into the release.
          APP_SIG=$(ls sig/*.app.tar.gz.sig 2>/dev/null | head -1 || true)
          if [[ -n "$APP_SIG" && -f "$APP_SIG" ]]; then
            APP=$(basename "$APP_SIG" .sig)
            PLATFORMS=$(jq -n --argjson p "$PLATFORMS" \
              --arg msig "$(cat "$APP_SIG")" \
              --arg murl "$BASE/$(enc "$APP")" \
              '$p + {
                "darwin-universal": {signature:$msig, url:$murl},
                "darwin-aarch64": {signature:$msig, url:$murl},
                "darwin-x86_64": {signature:$msig, url:$murl}}')
          else
            echo "::warning::No macOS .sig found — latest.json will be Windows-only"
          fi
          jq -n \
            --arg v "$TAG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$PLATFORMS" \
            '{version:$v, notes:"", pub_date:$date, platforms:$p}' \
            > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

      # Legacy clients (<=0.2.2) poll tutorapp_public for latest.json. The
      # asset URLs inside point at tutorapp — public now, so binaries are
      # fetched from there; only the manifest itself is mirrored.
      - name: Mirror latest.json to tutorapp_public
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          MAIN_REPO: kostyanpilkin-hash/tutorapp
          LEGACY_REPO: kostyanpilkin-hash/tutorapp_public
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$MAIN_REPO" --pattern "latest.json" --dir . --clobber
          gh release upload "$TAG" latest.json --repo "$LEGACY_REPO" --clobber
